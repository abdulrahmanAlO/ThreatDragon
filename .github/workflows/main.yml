on:
  push:
    branches: main

jobs:
  depchecktest:
    runs-on: ubuntu-latest
    name: depecheck_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: update with npm
        run: npm install
      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@v3.0.0
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          out: 'reports'
          fail_on_error: false
      - name: Upload Test results
        uses: actions/upload-artifact@v4
        with:
           name: Depcheck report
           path: reports
